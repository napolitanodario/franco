<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ device_name }}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121417;
      --panel: #1c2128;
      --text: #e8eaed;
      --muted: #a8b0ba;
      --line: #2d343e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 20px 20px 4px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
      font-weight: 600;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      padding: 16px;
    }

    figure {
      margin: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    figcaption {
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    figcaption span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }

    footer {
      padding: 0 20px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    a {
      color: #8ab4f8;
    }
  </style>
</head>
<body>
  <header>
    <h1>{{ device_name }}</h1>
    <p>Live color and depth at {{ width }}x{{ height }}, {{ fps }} fps.</p>
  </header>
  <main>
    <figure>
      <figcaption>
        Color
        <span>RGB image from the color sensor.</span>
      </figcaption>
      <img src="{{ url_for('color_stream') }}" width="{{ width }}" height="{{ height }}" alt="Color stream">
    </figure>
    <figure>
      <figcaption>
        Depth
        <span>False color view of the depth sensor. The scale follows the distances currently in view.</span>
      </figcaption>
      <img src="{{ url_for('depth_stream') }}" width="{{ width }}" height="{{ height }}" alt="Depth stream">
    </figure>
  </main>
  <footer>
    <p>The pictures stay empty until the camera publishes a frame. <a href="{{ url_for('status') }}">/status</a> reports capture errors as JSON.</p>
  </footer>
</body>
</html>
