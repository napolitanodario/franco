name: Bench
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run on main
        required: true
        type: string
      activate:
        description: Activate and check live ROS data (otherwise build only)
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
concurrency:
  group: franco-bench
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      artifact_id: ${{ steps.verify.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python3 scripts/ci_bundle.py verify "$CI_RUN_ID"
  bench:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, franco]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: deploy-tools
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/franco-${{ github.run_id }}
      - name: Prepare or activate release
        env:
          BUNDLE: ${{ runner.temp }}/franco-${{ github.run_id }}
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
          ACTIVATE: ${{ inputs.activate }}
        run: |
          command=prepare
          if [ "$ACTIVATE" = true ]; then command=deploy; fi
          ./deploy-tools/scripts/franco "$command" "$BUNDLE" "$EXPECTED_SHA"
