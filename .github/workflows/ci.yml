name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate workflows
        env:
          ACTIONLINT_SHA: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tgz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_arm64.tar.gz
          printf '%s  %s\n' "$ACTIONLINT_SHA" "$RUNNER_TEMP/actionlint.tgz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/*.yml
      - name: Build and test without hardware or network
        run: bash ci/run-local.sh
      - name: Package tested source
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/ci_bundle.py pack "$GITHUB_SHA" out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: franco-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14
