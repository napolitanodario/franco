# Deploy the shared checkout on the Raspberry Pi.
#
# GitHub-hosted runners are not on the tailnet, so this job runs on the
# self-hosted runner registered as the franco user. The job updates the clone
# in /srv/franco/ros2_ws/src/franco, builds the project packages, and restarts the
# graph. It does not restart the runner service.

name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, franco]
    steps:
      - name: Update the shared checkout and restart the graph
        run: |
          set -eu
          systemctl --user stop franco.service || true
          cd /srv/franco/ros2_ws/src/franco
          git fetch origin main
          git reset --hard origin/main
          # shellcheck disable=SC1091
          source /srv/franco/ros2_ws/src/franco/deploy/env.sh
          cd /srv/franco/ros2_ws
          # setuptools copies package data with chmod and utime. The kernel
          # allows that only for the file owner, so a tree left by dario makes
          # this franco job fail with "Operation not permitted".
          packages=(franco_diagnostics franco_perception franco_tools franco_bringup)
          for package in franco "${packages[@]}"; do
            rm -rf "build/$package" "install/$package"
          done
          colcon build --packages-select "${packages[@]}"
          systemctl --user start franco.service
