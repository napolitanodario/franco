# Deploy the shared checkout on the Raspberry Pi.
#
# GitHub-hosted runners are not on the tailnet, so this job runs on the
# self-hosted runner registered as the franco user. The job updates the clone
# in /srv/franco/ros2_ws/src/franco, builds that package, and restarts the
# graph. It does not restart the runner service.

name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, franco]
    steps:
      - name: Update the shared checkout and restart the graph
        run: |
          set -eu
          systemctl --user stop franco.service || true
          cd /srv/franco/ros2_ws/src/franco
          git fetch origin main
          git reset --hard origin/main
          # shellcheck disable=SC1091
          source /srv/franco/ros2_ws/src/franco/deploy/env.sh
          cd /srv/franco/ros2_ws
          colcon build --packages-select franco --cmake-args -DCMAKE_BUILD_TYPE=Release
          systemctl --user start franco.service
